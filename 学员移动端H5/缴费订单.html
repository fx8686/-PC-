<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>缴费订单 - 特殊工种延期教育系统（移动端）</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/orders.css">
</head>
<body data-page="orders">

<div class="app">
  <header class="navbar">
    <span class="nav-btn"></span>
    <span class="nav-title">缴费订单</span>
    <button class="nav-btn right" id="btn-logout" type="button">退出</button>
  </header>

  <main class="page">
    <div class="chips" id="order-chips">
      <button class="chip active" data-status="">全部</button>
      <button class="chip" data-status="unpaid">待支付</button>
      <button class="chip" data-status="paid">已支付</button>
    </div>
    <div id="order-list">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
    <p class="hint" style="padding:0 4px;">报名费 600 元 / 条，每条报名档案独立生成订单；缴费成功后即可开始该工种课程学习。</p>
  </main>
</div>

<!-- ==================== 发票填写弹层 ==================== -->
<div class="mask" id="sheet-invoice">
  <div class="sheet">
    <div class="sheet-head">
      <span>填写发票信息</span>
      <button class="sheet-close" type="button" data-close="sheet-invoice">×</button>
    </div>
    <div class="sheet-body" id="invoice-body">
      <!-- 订单基础信息 -->
      <div class="inv-order-card">
        <div class="kv"><span>工种名称</span><span id="inv-work">-</span></div>
        <div class="kv"><span>证书编号</span><span id="inv-cert">-</span></div>
        <div class="kv"><span>费用金额</span><span class="v price">￥600 / 条</span></div>
      </div>

      <!-- 发票类型切换 -->
      <div class="inv-type-row">
        <span class="label">发票类型：</span>
        <label><input type="radio" name="invType" value="personal" checked> 个人发票</label>
        <label><input type="radio" name="invType" value="enterprise"> 企业发票</label>
      </div>

      <!-- 个人发票表单 -->
      <div class="inv-section" id="inv-personal">
        <div class="inv-field"><label><span class="req">*</span>姓名</label>
          <input type="text" data-field="p.name" placeholder="请输入姓名">
          <span class="err-msg"></span></div>
        <div class="inv-field"><label><span class="req">*</span>身份证号</label>
          <input type="text" data-field="p.idCard" placeholder="请输入 18 位身份证号" maxlength="18">
          <span class="err-msg"></span></div>
        <div class="inv-field"><label>电子发票接收邮箱（选填）</label>
          <input type="text" data-field="p.email" placeholder="如填写需校验邮箱格式">
          <span class="err-msg"></span></div>
        <div class="inv-field"><label><span class="req">*</span>手机号</label>
          <input type="text" data-field="p.phone" placeholder="请输入 11 位手机号" maxlength="11">
          <span class="err-msg"></span></div>
      </div>

      <!-- 企业发票表单 -->
      <div class="inv-section hidden" id="inv-enterprise">
        <div class="inv-field"><label><span class="req">*</span>企业名称</label>
          <input type="text" data-field="e.companyName" placeholder="请输入企业全称">
          <span class="err-msg"></span></div>
        <div class="inv-field"><label><span class="req">*</span>纳税人识别号 / 统一社会信用代码</label>
          <input type="text" data-field="e.taxNo" placeholder="请输入 15-18 位代码" maxlength="18">
          <span class="err-msg"></span></div>
        <div class="inv-field"><label><span class="req">*</span>地址</label>
          <input type="text" data-field="e.address" placeholder="请输入企业地址">
          <span class="err-msg"></span></div>
        <div class="inv-field"><label><span class="req">*</span>电话</label>
          <input type="text" data-field="e.phone" placeholder="请输入企业联系电话">
          <span class="err-msg"></span></div>
        <div class="inv-field"><label><span class="req">*</span>开户行及账号</label>
          <input type="text" data-field="e.bankAccount" placeholder="例如：中国工商银行菏泽分行 6222 ...">
          <span class="err-msg"></span></div>
        <div class="inv-field"><label><span class="req">*</span>联系人姓名</label>
          <input type="text" data-field="e.contactName" placeholder="请输入联系人姓名">
          <span class="err-msg"></span></div>
        <div class="inv-field"><label><span class="req">*</span>联系人电话</label>
          <input type="text" data-field="e.contactPhone" placeholder="请输入 11 位手机号" maxlength="11">
          <span class="err-msg"></span></div>
        <div class="inv-field"><label><span class="req">*</span>电子发票接收邮箱</label>
          <input type="text" data-field="e.email" placeholder="请输入接收邮箱">
          <span class="err-msg"></span></div>
      </div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" type="button" data-close="sheet-invoice">取消</button>
      <button class="btn btn-primary" type="button" id="btn-invoice-next">下一步，去缴费</button>
    </div>
  </div>
</div>

<!-- ==================== 聚合支付弹层 ==================== -->
<div class="mask" id="sheet-pay">
  <div class="sheet">
    <div class="sheet-head">
      <span>扫码支付</span>
      <button class="sheet-close" type="button" data-close="sheet-pay">×</button>
    </div>

    <div class="sheet-body">
      <!-- 待支付视图 -->
      <div id="pay-main">
        <div class="pay-amount"><span class="rmb">￥</span><b id="pay-amount">600</b></div>
        <div class="pay-sub" id="pay-sub"></div>

        <div class="pay-channels" id="pay-channels">
          <button class="channel active" type="button" data-channel="wechat">
            <span class="ch-logo wechat">微</span>微信支付
          </button>
          <button class="channel" type="button" data-channel="alipay">
            <span class="ch-logo alipay">支</span>支付宝
          </button>
        </div>

        <div class="qr-wrap">
          <canvas id="pay-qr" width="420" height="420"></canvas>
          <div class="qr-center" id="qr-center">微</div>
        </div>

        <div class="pay-hint" id="pay-hint">请使用微信扫一扫，扫描上方二维码完成支付</div>

        <div class="pay-status" id="pay-status">
          <span class="dot"></span><span id="pay-status-text">等待支付...</span>
        </div>
        <div class="demo-note">二维码有效期 15 分钟 · 演示环境下单约 8 秒后自动确认支付</div>
      </div>

      <!-- 支付成功视图 -->
      <div id="pay-success" class="hide">
        <div class="success-icon">✓</div>
        <div class="success-title">支付成功</div>
        <div class="success-text" id="success-text"></div>
      </div>
    </div>

    <div class="sheet-foot" id="pay-foot">
      <button class="btn btn-ghost" type="button" data-close="sheet-pay">关闭</button>
      <button class="btn btn-primary" id="btn-query" type="button">查询支付状态</button>
    </div>
    <div class="sheet-foot hide" id="pay-foot-success">
      <button class="btn btn-primary" type="button" data-close="sheet-pay">完成</button>
    </div>
  </div>
</div>

<!-- ==================== 订单详情弹层 ==================== -->
<div class="mask" id="sheet-detail">
  <div class="sheet">
    <div class="sheet-head">
      <span>订单详情</span>
      <button class="sheet-close" type="button" data-close="sheet-detail">×</button>
    </div>
    <div class="sheet-body" id="detail-body"></div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" type="button" data-close="sheet-detail">关闭</button>
      <button class="btn btn-primary" id="btn-detail-pay" type="button">去缴费</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
