<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>缴费订单列表 - 特殊工种延期教育系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #262626; min-height: 100vh; }
  a { text-decoration: none; color: inherit; }

  /* 顶部导航栏 */
  .topbar { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #fff; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; color: #1f1f1f; }
  .brand .logo { width: 32px; height: 32px; border-radius: 8px; background: #1677ff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .user { display: flex; align-items: center; gap: 16px; color: #595959; font-size: 14px; }
  .user .avatar { width: 32px; height: 32px; border-radius: 50%; background: #e6f4ff; color: #1677ff; display: flex; align-items: center; justify-content: center; font-weight: 600; }
  .user .divider { width: 1px; height: 16px; background: #e8e8e8; }
  .logout { background: none; border: none; color: #8c8c8c; cursor: pointer; font-size: 14px; }
  .logout:hover { color: #ff4d4f; }

  /* 左侧菜单栏 */
  .sidebar { position: fixed; top: 60px; left: 0; bottom: 0; width: 220px; background: #001529; color: rgba(255,255,255,0.75); padding: 12px 0; overflow-y: auto; z-index: 99; }
  .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 24px; font-size: 14px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.2s; }
  .menu-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .menu-item.active { background: #1677ff; color: #fff; border-left-color: #fff; }
  .menu-item.disabled { color: rgba(255,255,255,0.3); cursor: not-allowed; }
  .menu-item.disabled:hover { background: transparent; color: rgba(255,255,255,0.3); }
  .menu-item .icon { font-size: 16px; width: 20px; text-align: center; }

  /* 内容区 */
  .main { margin-left: 220px; margin-top: 60px; padding: 24px; min-height: calc(100vh - 60px); }
  .page-title { font-size: 20px; font-weight: 600; margin-bottom: 16px; color: #1f1f1f; }
  .page-desc { font-size: 13px; color: #8c8c8c; margin: -8px 0 16px; }

  /* 筛选栏 */
  .filter-bar { background: #fff; border-radius: 10px; padding: 16px 20px; display: flex; align-items: center; gap: 12px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); flex-wrap: wrap; }
  .filter-bar label { font-size: 14px; color: #595959; }
  .filter-bar select, .filter-bar input { height: 36px; padding: 0 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; outline: none; transition: all 0.2s; background: #fff; }
  .filter-bar select:hover, .filter-bar input:hover { border-color: #4096ff; }
  .filter-bar select:focus, .filter-bar input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,0.12); }
  .filter-bar input { width: 200px; }

  /* 表格 */
  .table-card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: #fafafa; padding: 14px 16px; text-align: left; font-size: 13px; font-weight: 600; color: #595959; border-bottom: 1px solid #f0f0f0; }
  tbody td { padding: 14px 16px; font-size: 14px; color: #262626; border-bottom: 1px solid #f5f5f5; }
  tbody tr { transition: background 0.15s; }
  tbody tr:hover { background: #f0f7ff; }
  tbody tr:last-child td { border-bottom: none; }
  .amount { font-weight: 600; color: #cf1322; }

  .tag { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 4px; font-size: 12px; font-weight: 500; }
  .tag-unpaid { background: #fff7e6; color: #d46b08; border: 1px solid #ffd591; }
  .tag-paid { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }

  .btn { height: 34px; padding: 0 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; transition: all 0.2s; font-weight: 500; }
  .btn-primary { background: #1677ff; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #4096ff; }
  .btn-primary:disabled { background: #bfbfbf; cursor: not-allowed; }
  .btn-default { background: #fff; color: #595959; border: 1px solid #d9d9d9; }
  .btn-default:hover { color: #1677ff; border-color: #1677ff; }
  .btn-link { background: none; border: none; color: #1677ff; cursor: pointer; font-size: 13px; padding: 0; }
  .btn-link:hover { color: #4096ff; }

  .empty { text-align: center; padding: 60px 20px; color: #8c8c8c; font-size: 14px; }

  /* 弹窗 */
  .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; align-items: center; justify-content: center; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 10px; width: 440px; max-width: 90vw; box-shadow: 0 12px 40px rgba(0,0,0,0.2); overflow: hidden; animation: pop 0.2s ease; }
  @keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 16px; font-weight: 600; color: #1f1f1f; }
  .modal-close { cursor: pointer; color: #8c8c8c; font-size: 20px; line-height: 1; background: none; border: none; }
  .modal-close:hover { color: #262626; }
  .modal-body { padding: 20px; }
  .modal-footer { padding: 12px 20px 20px; display: flex; gap: 10px; justify-content: flex-end; }
  .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #f0f0f0; font-size: 14px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .k { color: #8c8c8c; }
  .detail-row .v { color: #262626; font-weight: 500; }

  /* Toast */
  .toast { position: fixed; top: 84px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 14px; z-index: 2000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">🛡️</span>特殊工种延期教育系统</div>
  <div class="user">
    <span class="avatar" id="user-avatar">张</span><span>学员：<span id="user-name">张三</span></span><span class="divider"></span>
    <span>证件号：<span id="user-idcard">110***********1234</span></span><span class="divider"></span>
    <button class="logout" onclick="logout()">退出登录</button>
  </div>
</header>
<aside class="sidebar">
  <a href="工作台.html" class="menu-item" style="display:none;"><span class="icon">🏠</span><span>首页工作台</span></a>
  <a href="个人报名信息.html" class="menu-item"><span class="icon">📋</span><span>个人报名信息</span></a>
  <a href="我的课程.html" class="menu-item" data-lock="1"><span class="icon">📚</span><span>我的课程</span></a>
  <a href="缴费订单.html" class="menu-item active"><span class="icon">💰</span><span>缴费订单</span></a>
  <a href="我的考试.html" class="menu-item" data-lock="1"><span class="icon">📝</span><span>我的考试</span></a>
  <a href="继续教育档案.html" class="menu-item" style="display:none;"><span class="icon">📄</span><span>继续教育档案</span></a>
  <a href="我的证书.html" class="menu-item" style="display:none;"><span class="icon">🎓</span><span>我的证书</span></a>
  <a href="系统公告.html" class="menu-item" style="display:none;"><span class="icon">📢</span><span>系统公告</span></a>
  <a href="帮助中心.html" class="menu-item" style="display:none;"><span class="icon">❓</span><span>帮助中心</span></a>
</aside>
<main class="main">
  <div class="page-title">缴费订单列表</div>
  <div class="page-desc">每条报名学习档案单独计费，单价 600 元，缴费后仅解锁该工种对应的视频课程。</div>

  <div class="filter-bar">
    <label>订单状态：</label>
    <select id="filter-status">
      <option value="">全部</option>
      <option value="unpaid">待支付</option>
      <option value="paid">已支付</option>
    </select>
    <input type="text" id="search-input" placeholder="搜索订单编号 / 工种名称">
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>订单编号</th>
          <th>对应工种名称</th>
          <th>订单金额</th>
          <th>发票类型</th>
          <th>创建时间</th>
          <th>订单状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="order-tbody"></tbody>
    </table>
  </div>
</main>

<!-- 订单详情弹窗 -->
<div class="modal-mask" id="modal-detail">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title">订单详情</span>
      <button class="modal-close" onclick="closeModal('modal-detail')">×</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="closeModal('modal-detail')">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ========== 读取当前登录用户 ==========
  function getCurrentUser() {
    try { return JSON.parse(sessionStorage.getItem('current_user') || 'null'); } catch(e) { return null; }
  }
  const currentUser = getCurrentUser();
  if (currentUser) {
    document.getElementById('user-name').textContent = currentUser.name || '张三';
    document.getElementById('user-avatar').textContent = (currentUser.name || '张').charAt(0);
    const idCard = currentUser.idCard || '110101199001011234';
    document.getElementById('user-idcard').textContent =
      idCard.length >= 10 ? idCard.substring(0,3) + '***********' + idCard.substring(idCard.length-4) : idCard;
  }

  // ========== 报名档案 & 订单数据（与我的课程共享 sessionStorage） ==========
  const UNIT_PRICE = 600;

  function getArchives() {
    try { return JSON.parse(sessionStorage.getItem('signup_archives') || '[]'); } catch(e) { return []; }
  }
  function saveArchives(list) { sessionStorage.setItem('signup_archives', JSON.stringify(list)); }

  // 演示数据初始化（仅首次进入且无数据时写入）
  function ensureDemoData() {
    if (sessionStorage.getItem('pay_demo_seeded')) return;
    sessionStorage.setItem('pay_demo_seeded', '1');
    if (getArchives().length) return;
    saveArchives([
      { id:'REG2025010001', status:'approved', paid:true,  workType:'低压电工作业',     certNo:'TZ202111000123', learnType:'继续教育学员', createdAt:'2025-09-02 10:12', paidAt:'2025-09-03 09:20' },
      { id:'REG2025010002', status:'approved', paid:false, workType:'高压电工作业',     certNo:'TZ202111000456', learnType:'继续教育学员', createdAt:'2025-09-05 14:30' },
      { id:'REG2025010003', status:'pending',  paid:false, workType:'焊接与热切割作业', certNo:'TZ202111000789', learnType:'继续教育学员', createdAt:'2025-09-08 16:45' },
      { id:'REG2025010004', status:'approved', paid:true,  workType:'高处作业',         certNo:'TZ202411000321', learnType:'继续教育学员', createdAt:'2024-08-11 09:00', paidAt:'2024-08-12 10:05' }
    ]);
    sessionStorage.setItem('qual_status', 'approved');
  }
  ensureDemoData();

  // 订单由已审核通过的报名档案派生：一条档案 = 一笔订单
  function getOrders() {
    return getArchives()
      .filter(a => a.status === 'approved')
      .map(a => ({
        orderNo: 'ORD' + String(a.id || '').replace('REG', ''),
        archiveNo: a.id || '-',
        workType: a.workType || '-',
        certNo: a.certNo || '-',
        amount: UNIT_PRICE,
        createTime: a.createdAt || '-',
        status: a.paid ? 'paid' : 'unpaid',
        payTime: a.paid ? (a.paidAt || '-') : '',
        invoice: a.invoice || null // 从 archive 读取发票数据
      }));
  }

  const ORDER_STATUS = {
    unpaid: { cls: 'tag-unpaid', text: '待支付' },
    paid:   { cls: 'tag-paid',   text: '已支付' }
  };

  let currentStatus = '';
  let currentKeyword = '';

  function getFiltered() {
    return getOrders().filter(o => {
      const okStatus = !currentStatus || o.status === currentStatus;
      const okKw = !currentKeyword || o.orderNo.includes(currentKeyword) || o.workType.includes(currentKeyword);
      return okStatus && okKw;
    });
  }

  function render() {
    const list = getFiltered();
    const tbody = document.getElementById('order-tbody');
    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无符合条件的缴费订单</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(o => {
      const st = ORDER_STATUS[o.status];
      const invTypeTxt = o.invoice ? (o.invoice.type === 'personal' ? '个人发票' : '企业发票') : '—';
      return `<tr>
        <td>${o.orderNo}</td>
        <td>${o.workType}</td>
        <td class="amount">￥${o.amount}</td>
        <td>${invTypeTxt}</td>
        <td>${o.createTime}</td>
        <td><span class="tag ${st.cls}">${st.text}</span></td>
        <td><button class="btn-link" onclick="viewDetail('${o.orderNo}')">查看详情</button></td>
      </tr>`;
    }).join('');
  }

  // ========== 订单详情弹窗 ==========
  function viewDetail(orderNo) {
    const o = getOrders().find(x => x.orderNo === orderNo);
    if (!o) return;
    const st = ORDER_STATUS[o.status];

    // 基础订单信息
    let html = `
      <div style="font-size:15px;font-weight:600;color:#1f1f1f;margin-bottom:8px;">订单基础信息</div>
      <div class="detail-row"><span class="k">订单号</span><span class="v">${o.orderNo}</span></div>
      <div class="detail-row"><span class="k">对应工种</span><span class="v">${o.workType}</span></div>
      <div class="detail-row"><span class="k">关联报名档案编号</span><span class="v">${o.archiveNo}</span></div>
      <div class="detail-row"><span class="k">证书编号</span><span class="v">${o.certNo}</span></div>
      <div class="detail-row"><span class="k">订单金额</span><span class="v" style="color:#cf1322;">￥${o.amount}</span></div>
      <div class="detail-row"><span class="k">订单状态</span><span class="v"><span class="tag ${st.cls}">${st.text}</span></span></div>
      <div class="detail-row"><span class="k">下单时间</span><span class="v">${o.createTime}</span></div>
      <div class="detail-row"><span class="k">支付时间</span><span class="v">${o.payTime || '—'}</span></div>
    `;

    // 发票信息分区
    html += `<div style="margin-top:16px;border-top:1px dashed #e8e8e8;padding-top:14px;">`;
    html += `<div style="font-size:15px;font-weight:600;color:#1f1f1f;margin-bottom:8px;">发票信息</div>`;
    if (!o.invoice) {
      html += `<div class="detail-row"><span class="k">发票类型</span><span class="v" style="color:#bfbfbf;">未填写</span></div>`;
    } else if (o.invoice.type === 'personal') {
      const inv = o.invoice;
      html += `
        <div class="detail-row"><span class="k">发票类型</span><span class="v">个人发票</span></div>
        <div class="detail-row"><span class="k">姓名</span><span class="v">${inv.name || '—'}</span></div>
        <div class="detail-row"><span class="k">身份证号</span><span class="v">${inv.idCard || '—'}</span></div>
        <div class="detail-row"><span class="k">手机号</span><span class="v">${inv.phone || '—'}</span></div>
        <div class="detail-row"><span class="k">电子发票接收邮箱</span><span class="v">${inv.email || '未填写'}</span></div>
      `;
    } else {
      const inv = o.invoice;
      html += `
        <div class="detail-row"><span class="k">发票类型</span><span class="v">企业发票</span></div>
        <div class="detail-row"><span class="k">企业名称</span><span class="v">${inv.companyName || '—'}</span></div>
        <div class="detail-row"><span class="k">纳税人识别号</span><span class="v">${inv.taxNo || '—'}</span></div>
        <div class="detail-row"><span class="k">地址</span><span class="v">${inv.address || '—'}</span></div>
        <div class="detail-row"><span class="k">电话</span><span class="v">${inv.phone || '—'}</span></div>
        <div class="detail-row"><span class="k">开户行及账号</span><span class="v">${inv.bankAccount || '—'}</span></div>
        <div class="detail-row"><span class="k">联系人姓名</span><span class="v">${inv.contactName || '—'}</span></div>
        <div class="detail-row"><span class="k">联系人电话</span><span class="v">${inv.contactPhone || '—'}</span></div>
        <div class="detail-row"><span class="k">电子发票接收邮箱</span><span class="v">${inv.email || '—'}</span></div>
      `;
    }
    html += `</div>`;

    document.getElementById('detail-body').innerHTML = html;
    document.getElementById('modal-detail').classList.add('show');
  }

  function closeModal(id) { document.getElementById(id).classList.remove('show'); }
  document.getElementById('modal-detail').addEventListener('click', e => {
    if (e.target.id === 'modal-detail') closeModal('modal-detail');
  });

  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  document.getElementById('filter-status').addEventListener('change', e => { currentStatus = e.target.value; render(); });
  document.getElementById('search-input').addEventListener('input', e => { currentKeyword = e.target.value.trim(); render(); });

  // ========== 资质状态锁定菜单 ==========
  (function() {
    const status = sessionStorage.getItem('qual_status') || 'approved';
    if (status !== 'approved') {
      const tip = status === 'pending' ? '报名信息待审核，暂不可访问该模块'
        : (status === 'rejected' ? '报名信息审核未通过，请修改后重新提交' : '请先提交报名信息，审核通过后可访问该模块');
      document.querySelectorAll('.menu-item[data-lock="1"]').forEach(item => {
        item.classList.add('disabled');
        item.setAttribute('href', 'javascript:void(0)');
        item.addEventListener('click', e => { e.preventDefault(); alert(tip); });
      });
    }
  })();

  function logout() { sessionStorage.clear(); window.location.href = '登录.html'; }

  render();
</script>
</body>
</html>
